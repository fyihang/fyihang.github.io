<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        --bg-white: #fffdfd;
        --milk-wave-1: rgba(255, 232, 252, 0.88);
        --milk-wave-2: rgba(247, 233, 255, 0.82);
        --milk-wave-3: rgba(255, 244, 250, 0.85);
        --pink: #ff7fd1;
        --purple: #9f6bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 15% 15%, #fff3fc 0%, transparent 52%),
          radial-gradient(circle at 85% 20%, #f7ebff 0%, transparent 50%),
          radial-gradient(circle at 50% 95%, #ffeef7 0%, transparent 40%),
          var(--bg-white);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
      }

      body::before {
        left: -15vmax;
        top: -10vmax;
        background: linear-gradient(135deg, var(--milk-wave-1), var(--milk-wave-2));
      }

      body::after {
        right: -10vmax;
        bottom: -20vmax;
        background: linear-gradient(135deg, var(--milk-wave-2), var(--milk-wave-3));
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 14vw, 11rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-align: center;
        border-radius: 999px;
        padding: 0.25em 0.55em;
        color: transparent;
        background-image: linear-gradient(120deg, #ff8fd6 0%, #d28cff 45%, #8e7cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        position: relative;
        text-shadow: 0 0 20px rgba(255, 199, 237, 0.75),
          0 0 45px rgba(168, 146, 255, 0.55), 0 8px 30px rgba(255, 160, 222, 0.3);
      }

      h1::before {
        content: "";
        position: absolute;
        inset: 0.15em;
        border-radius: inherit;
        background: linear-gradient(
          140deg,
          rgba(255, 255, 255, 0.48),
          rgba(255, 255, 255, 0.08)
        );
        backdrop-filter: blur(10px) saturate(130%);
        -webkit-backdrop-filter: blur(10px) saturate(130%);
        mix-blend-mode: screen;
        z-index: -1;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35),
          0 18px 35px rgba(186, 133, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
  </body>
</html>
